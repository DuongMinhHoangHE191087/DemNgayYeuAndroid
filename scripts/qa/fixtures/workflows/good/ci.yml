name: CI
on:
  pull_request:
    branches:
      - main
      - kmp-ios
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/setup
  ios:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
