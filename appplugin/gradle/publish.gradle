// 2.0.0 C2b: publishing dùng chung cho 3 artifact (appplugin, appplugin-max, appplugin-game); artifactId = tên project.
// Groovy, không phải .gradle.kts: lint AGP 9.2.1 (UastGradleVisitor) sập khi quét script Kotlin phụ ở thư mục gradle/.
// LocalCheck = repo cục bộ build/repo ở gốc (không mạng, không ~/.m2) để tools/pom_check.sh kiểm 3 POM.
publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.app.plugin'
            artifactId = project.name
            version = rootProject.ext.sdkVersion
            afterEvaluate { from components.release }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/dungduong2899/appplugin')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
        maven {
            name = 'LocalCheck'
            url = uri(rootProject.layout.buildDirectory.dir('repo'))
        }
    }
}
