[pytest]
# `pytest` (console script, như job `backend` của CI) không tự thêm thư mục hiện tại vào sys.path:
# thiếu dòng này thì `from app import …` ở đầu file test là lỗi thu thập.
pythonpath = .
markers =
    integration: cần bigquery-emulator (docker compose, khoá `docker`); CI chạy `-m "not integration"`
