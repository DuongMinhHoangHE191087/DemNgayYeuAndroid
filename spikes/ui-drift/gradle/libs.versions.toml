[versions]
agp = "9.2.1"
kotlin = "2.2.10"
# Baseline = same as the app: BOM 2024.09.00 -> androidx Material3 1.3.0
composeBom = "2024.09.00"
# CMP variant (-PcomposeVariant=cmp): JetBrains Compose Multiplatform artifacts (Android target)
cmpCompose = "1.12.1"
cmpMaterial3 = "1.12.0-alpha03"
cmpIcons = "1.7.3"
coilCompose = "2.7.0"
junit = "4.13.2"
robolectric = "4.16.1"
roborazzi = "1.59.0"
androidxTestCore = "1.6.1"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "cmpCompose" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "cmpCompose" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "cmpCompose" }
cmp-animation = { group = "org.jetbrains.compose.animation", name = "animation", version.ref = "cmpCompose" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
cmp-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "cmpIcons" }
cmp-ui-test-junit4 = { group = "org.jetbrains.compose.ui", name = "ui-test-junit4", version.ref = "cmpCompose" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
